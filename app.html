<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#A63D40"
    >

    <title>Angolan Slang Dictionary</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div id="app">

        <div class="pattern pattern-top"></div>

        <!-- =========================================
             HEADER
        ========================================== -->

        <header class="header">

            <button
                class="brand"
                type="button"
                onclick="navigateTo('home')"
                aria-label="Go to home"
            >

                <div class="brand-symbol">

                    <img
                        src="assets/angola-flag2.png"
                        alt="Angola"
                    >

                </div>

                <div class="brand-text">

                    <strong>
                        Angolan Slang
                    </strong>

                    <span>
                        Dictionary
                    </span>

                </div>

            </button>


            <button
                class="header-button"
                id="menu-button"
                type="button"
                aria-label="Open menu"
            >
                ☰
            </button>

        </header>


        <!-- =========================================
             MAIN APPLICATION
             JavaScript renders pages here
        ========================================== -->

        <main id="main-content">
            <!-- JavaScript renders pages here -->
        </main>


        <!-- =========================================
             BOTTOM NAVIGATION
        ========================================== -->

        <nav
            class="bottom-navigation"
            aria-label="Main navigation"
        >

            <button
                class="nav-item active"
                data-page="home"
                type="button"
            >

                <span class="nav-icon">⌂</span>

                <span class="nav-label">
                    Home
                </span>

            </button>


            <button
                class="nav-item"
                data-page="dictionary"
                type="button"
            >

                <span class="nav-icon">▤</span>

                <span class="nav-label">
                    Dictionary
                </span>

            </button>


            <button
                class="nav-item nav-search"
                data-page="search"
                type="button"
            >

                <span class="nav-icon">⌕</span>

                <span class="nav-label">
                    Search
                </span>

            </button>


            <button
                class="nav-item"
                data-page="saved"
                type="button"
            >

                <span class="nav-icon">♡</span>

                <span class="nav-label">
                    Saved
                </span>

            </button>

        </nav>


        <!-- =========================================
             MENU OVERLAY
        ========================================== -->

        <div
            class="menu-overlay"
            id="menu-overlay"
        ></div>


        <!-- =========================================
             SIDE MENU
        ========================================== -->

        <aside
            class="side-menu"
            id="side-menu"
            aria-label="Application menu"
        >

            <div class="menu-header">

                <div>

                    <p class="menu-small-title">
                        ANGOLAN SLANG
                    </p>

                    <h2>
                        Explore
                    </h2>

                </div>


                <button
                    class="close-menu"
                    id="close-menu"
                    type="button"
                    aria-label="Close menu"
                >
                    ×
                </button>

            </div>


            <button
                class="menu-item"
                onclick="navigateTo('daily')"
                type="button"
            >

                <span>☀</span>

                3 Words of the Day

            </button>


            <button
                class="menu-item"
                onclick="navigateTo('updates')"
                type="button"
            >

                <span>✦</span>

                Updates

            </button>


            <button
                class="menu-item"
                onclick="navigateTo('about')"
                type="button"
            >

                <span>i</span>

                About the Dictionary

            </button>


            <button
                class="menu-item"
                onclick="navigateTo('settings')"
                type="button"
            >

                <span>⚙</span>

                Settings

            </button>

        </aside>

    </div>


    <!-- =========================================
         SCRIPTS
    ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="script.js"></script>

</body>

</html>
