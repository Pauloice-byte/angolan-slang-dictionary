<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#A63D40"
    >

    <title>Angolan Slang Dictionary</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div id="app">

    <!-- =========================
         DECORATIVE PATTERN
    ========================== -->

    <div class="pattern pattern-top"></div>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <button
            class="brand"
            type="button"
            onclick="navigateTo('home')"
            aria-label="Go to home"
        >

            <span class="brand-symbol">

                <img
                    src="assets/angola-flag2.png"
                    alt="Angola"
                >

            </span>

            <span class="brand-text">

                <strong>
                    Angolan Slang
                </strong>

                <span>
                    Dictionary
                </span>

            </span>

        </button>


        <button
            class="header-button"
            id="menu-button"
            type="button"
            aria-label="Open menu"
        >

            <span aria-hidden="true">
                ☰
            </span>

        </button>

    </header>


    <!-- =========================
         MAIN APP CONTENT
    ========================== -->

    <main id="main-content"></main>


    <!-- =========================
         BOTTOM NAVIGATION
    ========================== -->

    <nav
        class="bottom-navigation"
        aria-label="Main navigation"
    >

        <button
            class="nav-item active"
            data-page="home"
            type="button"
        >

            <span class="nav-icon">
                ⌂
            </span>

            <span class="nav-label">
                Home
            </span>

        </button>


        <button
            class="nav-item"
            data-page="dictionary"
            type="button"
        >

            <span class="nav-icon">
                ▤
            </span>

            <span class="nav-label">
                Dictionary
            </span>

        </button>


        <button
            class="nav-item nav-search"
            data-page="search"
            type="button"
        >

            <span class="nav-icon">
                ⌕
            </span>

            <span class="nav-label">
                Search
            </span>

        </button>


        <button
            class="nav-item"
            data-page="saved"
            type="button"
        >

            <span class="nav-icon">
                ♡
            </span>

            <span class="nav-label">
                Saved
            </span>

        </button>

    </nav>


    <!-- =========================
         MENU OVERLAY
    ========================== -->

    <div
        class="menu-overlay"
        id="menu-overlay"
    ></div>


    <!-- =========================
         SIDE MENU
    ========================== -->

 <aside
    class="side-menu"
    id="side-menu"
>

    <!-- =========================
         BRAND PANEL
    ========================== -->

    <div class="menu-brand-panel">

        <div class="menu-brand-top">

            <button
                class="menu-brand"
                type="button"
                onclick="navigateTo('home')"
                aria-label="Go to home"
            >

                <span class="menu-brand-symbol">

                    <img
                        src="assets/angola-flag2.png"
                        alt="Angola"
                    >

                </span>

                <span class="menu-brand-name">

                    <strong>
                        Dicionário Angolano
                    </strong>

                    <span>
                        Calão & Expressões Populares
                    </span>

                </span>

            </button>


            <button
                class="close-menu"
                id="close-menu"
                type="button"
                aria-label="Close menu"
            >
                ×
            </button>

        </div>


        <div class="menu-brand-content">

            <span class="menu-section-kicker">
                EXPLORA ANGOLA
            </span>

            <h2>
                Continua a
                <em>descobrir Angola.</em>
            </h2>

            <p>
                Explora as palavras e expressões que fazem parte da nossa cultura.
            </p>


            <div class="menu-quote">

                <span>
                    “
                </span>

                <p>
                    Cada palavra conta uma história.
                </p>

                <small>
                    Every word tells a story.
                </small>

            </div>

        </div>


        <div class="menu-brand-bottom">

            <span>
                ANGOLA
            </span>

            <div class="menu-mini-pattern"></div>

            <span>
                AO
            </span>

        </div>

    </div>


    <!-- =========================
         MENU ITEMS
    ========================== -->

    <div class="menu-navigation">

        <p class="menu-navigation-title">
            EXPLORAR
        </p>


        <button
            class="menu-item"
            type="button"
            onclick="navigateTo('daily')"
        >

            <span>
                ☀
            </span>

            3 Words of the Day

        </button>


        <button
            class="menu-item"
            type="button"
            onclick="navigateTo('updates')"
        >

            <span>
                ✦
            </span>

            Updates

        </button>


        <button
            class="menu-item"
            type="button"
            onclick="navigateTo('about')"
        >

            <span>
                i
            </span>

            About the Dictionary

        </button>


        <button
            class="menu-item"
            type="button"
            onclick="window.location.href='maka.html'"
        >

            <span>
                ✦
            </span>

            Maka

        </button>


        <button
            class="menu-item"
            type="button"
            onclick="navigateTo('settings')"
        >

            <span>
                ⚙
            </span>

            Settings

        </button>

    </div>


    <!-- =========================
         LOGOUT
    ========================== -->

    <button
        class="menu-item menu-item-logout"
        id="logout-button"
        type="button"
    >

        <span>
            ↪
        </span>

        Log out

    </button>

</aside>

</div>


<!-- =========================
     SCRIPTS
========================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="script.js"></script>

</body>

</html>
