<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Media | Angolan Slang Dictionary</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="admin-page">

        <header class="admin-header">

            <div>
                <a href="admin.html" class="back-link">
                    ← Back to Dashboard
                </a>

                <h1>Media</h1>

                <p>
                    Manage pronunciation audio for dictionary words.
                </p>
            </div>

        </header>


        <!-- SEARCH -->

        <section class="word-toolbar">

            <input
                type="search"
                id="wordSearch"
                placeholder="Search words..."
            >

        </section>


        <!-- MESSAGE -->

        <div
            id="mediaMessage"
            class="admin-message"
            style="display: none;"
        ></div>


        <!-- WORDS -->

        <section id="wordList">

            <div class="empty-state">
                Loading words...
            </div>

        </section>

    </main>


    <script src="js/supabase.js"></script>
    <script src="js/admin-media.js"></script>

</body>

</html>
